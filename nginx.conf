server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    # Не отдавать .git, .env и прочие скрытые файлы.
    location ~ /\. {
        deny all;
    }

    location /static/ {
        alias /static/;
    }

    # Бэкенд нужен только боту, который ходит на backend:8000 внутри
    # docker-сети. Правило закрывает и /api/docs, и /api/openapi.json.
    location /api/ {
        return 404;
    }

    # Админка доступна только с самого сервера: через SSH-туннель
    # (ssh -N -L 8000:127.0.0.1:8000 root@сервер) или curl внутри.
    # Так запросы идут через nginx, а значит статика отдаётся нормально.
    location /admin/ {
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Если понадобится открыть админку наружу (только после HTTPS):
    #   1) docker exec -it f1_nginx htpasswd -c /etc/nginx/.htpasswd admin
    #   2) заменить allow/deny выше на:
    #        auth_basic "Restricted";
    #        auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Нужен для SECURE_PROXY_SSL_HEADER при переходе на HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }
}

version: '3.8'

services:
  db:
    image: postgres:15
    container_name: f1_db_dev
    restart: always
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - f1_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: f1_redis_dev
    restart: always
    ports:
      - "6379:6379"
    networks:
      - f1_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build: .
    container_name: f1_celery_worker_dev
    restart: always
    command: ["celery", "-A", "backend", "worker", "-l", "info", "-c", "1"]
    env_file:
      - .env.dev
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - f1_network
    volumes:
      - .:/app

  celery_beat:
    build: .
    container_name: f1_celery_beat_dev
    restart: always
    command: ["celery", "-A", "backend", "beat", "-l", "info"]
    env_file:
      - .env.dev
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - f1_network
    volumes:
      - .:/app
    

volumes:
  postgres_dev_data:

networks:
  f1_network:
    driver: bridge